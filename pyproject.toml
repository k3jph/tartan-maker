[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tartan-maker"
version = "0.9.1"
description = "Define, validate, render, and export tartan designs from YAML."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "James Howard" }
]
keywords = ["tartan", "svg", "weaving", "textiles", "cli", "yaml"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "webcolors>=1.13",
  "spdlog>=2.0",
]

[project.optional-dependencies]
png = ["cairosvg>=2.7"]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/k3jph/tartan-maker"
Repository = "https://github.com/k3jph/tartan-maker"
Issues = "https://github.com/k3jph/tartan-maker/issues"

[project.scripts]
tartan-maker = "tartan_maker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tartan_maker"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
